interface:
  display_name: "CS/AI Coach"
  short_description: "默认加速计算机与人工智能练习思考，也可显式切换严格无提示模式"
  default_prompt: "Use $cs-ai-coach in the default GUIDED profile to follow the learner's route, carry out uniquely implied routine derivations, minimally correct local errors, and ask the targeted question at the first real bottleneck without replacing the route or revealing a full solution. Use $cs-ai-coach --strict for learner-provenance-only coaching. Keep the Teacher harness practice mode (/coach) in its separate HARD_LOCK boundary."
